name: Agent CLI Windows

on:
  workflow_dispatch:
  push:
    branches: ['agent-roots-*']

permissions:
  contents: read

jobs:
  cli:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: agent-cli-windows-x64
      - name: UNC regression test only
        run: |
          cargo test --locked -p gridcraft-engine --lib file_access::tests::external_windows_namespaces_are_rejected_before_filesystem_access -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Engine roots tests failed' }
          cargo test --locked -p gridcraft-engine --lib file_access::tests::windows_namespace_precheck_compares_normalized_whole_components -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Namespace comparison test failed' }
      - name: Prove UNC denial precedes filesystem access
        run: |
          $path = 'crates/engine/src/file_access.rs'
          $original = [IO.File]::ReadAllText($path)
          $guard = '        if !external_windows_namespace(path, folder) && inside(&resolve(path)?, folder) {'
          if (-not $original.Contains($guard)) { throw 'UNC precheck missing' }
          $mutations = @(
            '        if inside(&resolve(path)?, folder) {',
            '        if inside(&resolve(path)?, folder) && !external_windows_namespace(path, folder) {'
          )
          try {
            foreach ($replacement in $mutations) {
              [IO.File]::WriteAllText($path, $original.Replace($guard, $replacement))
              $output = cargo test --locked -p gridcraft-engine --lib file_access::tests::external_windows_namespaces_are_rejected_before_filesystem_access -- --exact 2>&1
              $code = $LASTEXITCODE
              $output | Write-Output
              if ($code -eq 0 -or ($output -join "`n") -notmatch 'test result: FAILED\. 0 passed; 1 failed') {
                throw "Mutation survived or failed to run: $replacement"
              }
              Write-Output "Killed mutation (1 failed test): $replacement"
            }
          } finally {
            [IO.File]::WriteAllText($path, $original)
          }
          $global:LASTEXITCODE = 0
      - name: Build portable CLI
        run: |
          cargo build --release --locked -p gridcraft-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & target/x86_64-pc-windows-msvc/release/gridcraft-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
      - name: Package with the official 0.12.1 companion files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist, official | Out-Null
          gh release download v0.12.1 --repo storytold/gridcraft --pattern 'gridcraft-0.12.1-windows-x64-portable.zip' --dir official
          if ($LASTEXITCODE -ne 0) { throw 'Official portable download failed' }
          gh release download v0.12.1 --repo storytold/gridcraft --pattern 'SHA256SUMS.txt' --dir official
          if ($LASTEXITCODE -ne 0) { throw 'Official checksums download failed' }
          $entries = @(Get-Content official/SHA256SUMS.txt | Where-Object { $_ -match '^[0-9a-fA-F]{64}\s+\*?gridcraft-0\.12\.1-windows-x64-portable\.zip$' })
          if ($entries.Count -ne 1) { throw 'Expected exactly one published portable checksum' }
          $expected = ($entries[0] -split '\s+')[0]
          $actual = (Get-FileHash official/gridcraft-0.12.1-windows-x64-portable.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Official portable checksum mismatch' }
          Write-Output "Verified official portable SHA256: $actual"
          Expand-Archive official/gridcraft-0.12.1-windows-x64-portable.zip official/unpacked
          $officialCli = @(Get-ChildItem official/unpacked -Recurse -Filter gridcraft-cli.exe)
          if ($officialCli.Count -ne 1) { throw 'Expected exactly one official CLI' }
          $stage = Join-Path $pwd 'dist/gridcraft-cli-0.12.1-roots-windows-x64'
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item -LiteralPath $officialCli[0].Directory.FullName -Destination "$stage/companions" -Recurse
          Move-Item -Path "$stage/companions/*" -Destination $stage
          Remove-Item -LiteralPath "$stage/companions"
          Copy-Item target/x86_64-pc-windows-msvc/release/gridcraft-cli.exe "$stage/gridcraft-cli.exe" -Force
          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content "$stage/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$stage/*" -DestinationPath dist/gridcraft-cli-0.12.1-roots-windows-x64.zip
          $zip = Get-FileHash dist/gridcraft-cli-0.12.1-roots-windows-x64.zip -Algorithm SHA256
          '{0}  gridcraft-cli-0.12.1-roots-windows-x64.zip' -f $zip.Hash.ToLowerInvariant() |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridcraft-cli-0.12.1-roots-windows-x64
          path: |
            dist/gridcraft-cli-0.12.1-roots-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
